{% set name = "python-xapian" %}
{% set version = "2.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://oligarchy.co.uk/xapian/{{ version }}/xapian-bindings-{{ version }}.tar.xz
  sha256: f52ec189f13b4fa66ea625a6eb94bb32dd651b9ec806be6a911dda54cbe3875c
  patches:
    - patches/py315-finalization-workaround.patch

build:
  number: 1
  skip: true  # [win or python_impl == 'pypy']

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - make

  host:
    - python
    - pip
    - setuptools
    - sphinx
    - xapian-core {{ version }}

  run:
    - python

test:
  imports:
    - xapian
  commands:
    # Keep an owning SWIG proxy alive until interpreter shutdown, to check if
    # finalization works correctly in Python 3.15.
    - python -c "import xapian; query = xapian.Query('shutdown-finalization-test')"

about:
  home: http://xapian.org
  license: GPL-2.0-or-later
  license_family: GPL
  license_file: COPYING
  summary: Python bindings for the Xapian Search Engine Library.
  description: |
    Xapian is an Open Source search engine library which allows developers
    to add advanced indexing and search facilities to their own applications.
    It has built-in support for several families of weighting models and also
    supports a rich set of boolean query operators.
  doc_url: https://xapian.org/docs/bindings/
  dev_url: https://xapian.org/bleeding

extra:
  recipe-maintainers:
    - kohr-h
